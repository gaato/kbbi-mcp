[project]
name = "kbbi-mcp"
version = "0.1.0"
description = "A simple MCP server for querying KBBI (Indonesian dictionary)"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "BlueOak-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gakuto Furuya", email = "57865205+gaato@users.noreply.github.com" }
]
requires-python = ">=3.13"
keywords = ["mcp", "kbbi", "dictionary", "indonesian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
urls = { Repository = "https://github.com/gaato/kbbi-mcp", Issues = "https://github.com/gaato/kbbi-mcp/issues" }
dependencies = [
    "mcp>=2.2.0,<3",
    "beautifulsoup4>=4.12,<5",
    "pydantic-settings>=2,<3",
    "mcp-types>=2.2.0,<3",
]

[project.scripts]
kbbi-mcp = "kbbi_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "pytest>=9,<10",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
preview = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
    "SIM",# simplify
    "RUF",# ruff-specific
    "D",  # pydocstyle
    "DOC",# pydoclint
]

# We want docstring *style* checks, but we don't require docstrings everywhere.
ignore = [
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-package",
    "undocumented-magic-method",
    "undocumented-public-init",
    "incorrect-blank-line-before-class", # conflicts with blank-line-before-class (D211)
    "multi-line-summary-second-line", # conflicts with multi-line-summary-first-line (D212)
]

[tool.ruff.lint.per-file-ignores]
# `main` stays here so the console entrypoint can import the server lazily.
"src/kbbi_mcp/__init__.py" = ["non-empty-init-module"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
root = ["./src"]

[tool.pytest.ini_options]
python_files = [
    "test_*.py",
]
markers = [
    "network: tests that require external network access (opt-in via env)",
]
